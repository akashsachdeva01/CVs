<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity | Job Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <div class="max-w-6xl mx-auto px-4 py-10">
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2 uppercase">
                JOB HUNTER BY TOPICLY
            </h1>
            <p class="text-slate-400">Job Scraper Tool</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl mb-10">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                
                <div class="md:col-span-6">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Required Skills / Keywords</label>
                    <input type="text" id="skills" placeholder="e.g. Python, AWS, Marketing, BGP..." class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Location</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute left-3 top-3 text-slate-500"></i>
                        <input type="text" id="location" placeholder="e.g. London, UK" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Min. Experience</label>
                    <input type="number" id="min-experience" placeholder="e.g. 5" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

            </div>

            <div class="mt-6 p-4 border-2 border-dashed border-slate-700 rounded-lg hover:border-blue-500 transition-colors cursor-pointer text-center">
                <p class="text-sm text-slate-400"><i class="fa-solid fa-file-arrow-up mr-2"></i> Future Feature: Drop Resume to auto-calculate Match Score</p>
            </div>

            <button id="generate-btn" class="mt-8 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-blue-900/20 flex justify-center items-center">
                <i class="fa-solid fa-magnifying-glass mr-2" id="btn-icon"></i> 
                <span id="btn-text">GENERATE LEAD LIST</span>
            </button>
        </div>

        <div id="job-count" class="mb-4 text-sm font-semibold text-emerald-400 hidden"></div>

        <div class="overflow-x-auto bg-slate-800 border border-slate-700 rounded-xl shadow-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-300 text-sm">
                        <th class="p-4 border-b border-slate-600 w-1/5">Company & Role</th>
                        <th class="p-4 border-b border-slate-600 w-1/6">Protocol Match Score</th>
                        <th class="p-4 border-b border-slate-600 w-[45%]">Mandate Summary</th>
                        <th class="p-4 border-b border-slate-600 w-[10%]">Hiring Contact</th>
                        <th class="p-4 border-b border-slate-600 text-center w-[8%]">Action</th>
                    </tr>
                </thead>
                <tbody class="text-sm" id="results-body">
                    <!-- Default content or empty state can go here initially -->
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-500">
                            Ready to search. Enter your criteria above and generate a lead list.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="/static/script.js"></script>

</body>
</html>
